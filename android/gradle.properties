org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
android.useAndroidX=true
# Flutter plugins still use the legacy Android/Kotlin DSL while AGP 9 migration
# is in progress. Keep these compatibility switches until Flutter removes them
# from its generated Android template.
android.newDsl=false
android.builtInKotlin=false
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
