name: el7lm_mobile
description: "El7lm mobile MVP for Android and iOS."
publish_to: 'none'
version: 1.0.11+29

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  crypto: ^3.0.6
  supabase_flutter: ^2.16.0
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.5.5
  url_launcher: ^6.3.2
  video_player: ^2.13.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.10.1
  webview_flutter_web: ^0.2.3+4
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  google_fonts: ^8.2.0
  country_picker: ^2.0.28
  image_picker: ^1.2.3
  audioplayers: ^6.1.0
  qr_flutter: ^4.1.0
  font_awesome_flutter: ^11.0.0
  record: ^7.1.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^18.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
